[project]
name = "heal-mlflow-showcase"
version = "0.1.3"
description = "Short MLflow showcase"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mlflow>=3,<4",
    "scikit-learn>=1.4",
    "skl2onnx>=1.18",
    "onnx>=1.17",
    "onnxruntime>=1.19",
    "pandas>=2.0",
    "mistralai>=3.9.0",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
